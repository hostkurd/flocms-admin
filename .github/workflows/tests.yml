name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        db: ['mysql:8.0']
        include:
          - php: '8.3'
            db: 'mariadb:10.6'
          - php: '8.3'
            db: 'mariadb:11.4'

    services:
      database:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: flo_admin_test
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: flo_admin_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot || healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      FLO_ADMIN_TEST_DB_HOST: 127.0.0.1
      FLO_ADMIN_TEST_DB_PORT: 3306
      FLO_ADMIN_TEST_DB_NAME: flo_admin_test
      FLO_ADMIN_TEST_DB_USER: root
      FLO_ADMIN_TEST_DB_PASS: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, pdo_sqlite, json, fileinfo
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint
        run: find src tests bootstrap.php resources/lang -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Report test failures as annotations
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Run configured database tests
        run: vendor/bin/phpunit

      - name: Run SQLite and verify unconfigured MySQL skips
        run: env -u FLO_ADMIN_TEST_DB_NAME vendor/bin/phpunit

  browser:
    name: Browser, assets and distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, zip, fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify reproducible versioned assets
        run: git diff --exit-code -- dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: composer archive --format=zip --dir=/tmp --file=flocms-admin-distribution
      - run: php scripts/check-distribution.php /tmp/flocms-admin-distribution.zip
